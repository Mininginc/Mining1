name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wms:wms@localhost:5432/wms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Restore drill
        env:
          DATABASE_URL: postgres://wms:wms@localhost:5432/wms_test
          ADMIN_DATABASE_URL: postgres://wms:wms@localhost:5432/postgres
          BACKUP_PASSPHRASE_FILE: /tmp/ci-backup-pass
        run: |
          echo "ci-only-$(date +%s%N)" > /tmp/ci-backup-pass
          scripts/restore-drill.sh
